name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: gitea.internal:30008
  IMAGE_NAME: nine9/my-tasks
  # Go toolchain image for the Dockerfile's build stage. Defaults to Docker
  # Hub; set the repository variable BUILD_IMAGE to a mirror or a copy in the
  # Gitea registry if the runner can't reach Docker Hub reliably. The final
  # image is FROM scratch, so this is the only image pulled.
  BUILD_IMAGE: ${{ vars.BUILD_IMAGE || 'golang:1.23-alpine' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # Docker Hub from the runner times out now and then (TLS handshake
      # timeout on auth.docker.io). Pull the build image with retries first;
      # the build then uses the local copy instead of going back to the hub.
      - name: Pull build image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/amd64 "${{ env.BUILD_IMAGE }}"; then
              exit 0
            fi
            echo "Pull attempt ${attempt} failed, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "Could not pull ${{ env.BUILD_IMAGE }} after 5 attempts" >&2
          exit 1

      # The Dockerfile runs the tests before building, so a failing test
      # fails this step and nothing is pushed.
      - name: Build image
        run: |
          SHA_SHORT=$(echo "${{ gitea.sha }}" | cut -c1-8)
          docker build \
            --platform linux/amd64 \
            --build-arg BUILD_IMAGE="${{ env.BUILD_IMAGE }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_SHORT} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          echo "SHA_SHORT=${SHA_SHORT}" >> "$GITEA_ENV"

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SHA_SHORT }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
